# Mock tools для CodeMie assistants.
# Якщо CodeMie 2.59.0 вимагає OpenAI-compatible function schema —
# знизу у кожному блоці готовий JSON.

tools:
  - name: mock_kyc_check
    description: >
      Mock KYC check — повертає результат identity verification,
      sanctions та PEP скринінгу для demo. Жодні зовнішні API не викликаються.
    attach_to: [wsKYCAgent]
    openai_function_schema:
      name: mock_kyc_check
      description: Perform KYC check against mock database
      parameters:
        type: object
        properties:
          tax_id:
            type: string
            pattern: "^[0-9]{10}$"
            description: 10-digit Ukrainian tax ID (ІПН)
        required: [tax_id]
    mock_responses:
      # tax_id → response
      "1234567890": {passed: true,  sanctions: false, pep: false}
      "9876543210": {passed: true,  sanctions: false, pep: false}
      "5555555555": {passed: false, sanctions: true,  pep: false}
      "_default":   {passed: true,  sanctions: false, pep: false}

  - name: mock_credit_history
    description: >
      Mock credit history pull — повертає нормалізований скор 300–850
      з mock бюро. Жодні зовнішні API не викликаються.
    attach_to: [wsCreditHistoryAgent]
    openai_function_schema:
      name: mock_credit_history
      description: Pull credit history score from mock bureau
      parameters:
        type: object
        properties:
          tax_id:
            type: string
            pattern: "^[0-9]{10}$"
        required: [tax_id]
    mock_responses:
      "1234567890": {score: 720, status: ok}   # happy path
      "9876543210": {score: 430, status: ok}   # decline (rule 5)
      "5555555555": {score: 650, status: ok}   # borderline (не досягне якщо KYC fail)
      "_default":   {score: 600, status: ok}

# Якщо CodeMie 2.59.0 не підтримує локальні mock responses в tool definition —
# альтернатива: завантажити mock dataset як knowledge base та інструктувати
# agent «читай mock dataset за tax_id». Деталі у demo_script.md.
