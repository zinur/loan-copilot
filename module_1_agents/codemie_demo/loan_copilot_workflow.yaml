# CodeMie Workflow · Loan Copilot supervisor pattern
# ----------------------------------------------------------------------------
# Відтворює src/orchestrator.py як CodeMie workflow.
#
# Supervisor = сам workflow engine. Routing — через вбудований `next.condition`
# проти context store (без Transform / custom_nodes). Прості ЗА-кадрові правила
# означають детерміновану маршрутизацію — NBU-audit friendly.
#
# Передумови:
#   У CodeMie створені 4 assistant'и зі slug'ами:
#     intake-agent, kycagent, credithistoryagent, underwriter
#
#   Кожен assistant у system prompt повертає JSON (output_schema нижче).
#   KYC та CreditHistory використовують вбудовану mock-таблицю в system prompt
#   (deterministic за tax_id — не потребує реальних tools):
#     tax_id останні 2 цифри:
#       < 20 → kyc_passed=true, credit_score=720
#       20–49 → kyc_passed=true, credit_score=430 (decline)
#       ≥ 50 → kyc_passed=false (sanctions hit)
#
# Інструкція:
#   1. Workflows → + Create Workflow → YAML view → paste → Save.
#   2. Start Execution → payload з demo_payloads.md.
#
# Context store (популюється з user input + state outputs):
#   full_name, tax_id, phone, email, monthly_income, amount, term_months, purpose
#   intake_complete, kyc_passed, credit_score, decision, rate_apr, reason
# ----------------------------------------------------------------------------

name: loan-copilot-supervisor
description: >
  Consumer loan processing: Intake → KYC → CreditHistory → Underwriter
  з детермінованою маршрутизацією через next.condition проти context store.
mode: Sequential

# ----------------------------------------------------------------------------
# ASSISTANTS — reference на вже створених assistant'ів у CodeMie
# ----------------------------------------------------------------------------
assistants:
  - id: intake
    assistant_id: intake-agent
  - id: kyc
    assistant_id: kycagent
  - id: credit-history
    assistant_id: credithistoryagent
  - id: underwriter
    assistant_id: underwriter

# ----------------------------------------------------------------------------
# STATES — конвеєр з inline conditional routing
# ----------------------------------------------------------------------------
states:

  # ──────────── 1. INTAKE ────────────
  - id: intake-state
    assistant_id: intake
    task: |
      Збери структуровану заявку з повідомлення клієнта.
      Поверни JSON за output_schema. Якщо не вистачає обов'язкових полів —
      став intake_complete=false і перерахуй missing_fields.
    output_schema: |
      {
        "type": "object",
        "properties": {
          "full_name":      {"type": "string"},
          "tax_id":         {"type": "string"},
          "phone":          {"type": "string"},
          "email":          {"type": "string"},
          "monthly_income": {"type": "number"},
          "amount":         {"type": "number"},
          "term_months":    {"type": "integer"},
          "purpose":        {"type": "string"},
          "intake_complete":{"type": "boolean"},
          "missing_fields": {"type": "array", "items": {"type": "string"}}
        },
        "required": ["intake_complete"]
      }
    resolve_dynamic_values_in_prompt: true
    next:
      condition:
        expression: "intake_complete == True"
        then: kyc-state
        otherwise: end

  # ──────────── 2. KYC ────────────
  - id: kyc-state
    assistant_id: kyc
    task: |
      Перевір KYC для tax_id {{tax_id}}, full_name {{full_name}}.
      ВИКОРИСТАЙ MOCK-ТАБЛИЦЮ (без зовнішніх tools):
        last 2 digits of tax_id ≥ 50 → kyc_passed=false, reason="sanctions hit"
        else → kyc_passed=true
      Поверни JSON.
    output_schema: |
      {
        "type": "object",
        "properties": {
          "kyc_passed": {"type": "boolean"},
          "reason":     {"type": "string"}
        },
        "required": ["kyc_passed"]
      }
    resolve_dynamic_values_in_prompt: true
    next:
      condition:
        expression: "kyc_passed == True"
        then: credit-history-state
        otherwise: end

  # ──────────── 3. CREDIT HISTORY ────────────
  - id: credit-history-state
    assistant_id: credit-history
    task: |
      Отримай credit_score для tax_id {{tax_id}}.
      MOCK-ТАБЛИЦЯ (deterministic за tax_id, без зовнішніх tools):
        last 2 digits < 20  → credit_score=720 (good)
        last 2 digits 20–49 → credit_score=430 (poor)
        else               → credit_score=650
      Поверни JSON.
    output_schema: |
      {
        "type": "object",
        "properties": {
          "credit_score": {"type": "integer"}
        },
        "required": ["credit_score"]
      }
    resolve_dynamic_values_in_prompt: true
    next:
      condition:
        expression: "credit_score >= 500"
        then: underwriter-state
        otherwise: end

  # ──────────── 4. UNDERWRITER ────────────
  # Опціонально: interrupt_before: true для HITL demo (user approves)
  - id: underwriter-state
    assistant_id: underwriter
    task: |
      На основі даних прийми фінальне рішення по кредиту:
        - amount: {{amount}}
        - term_months: {{term_months}}
        - monthly_income: {{monthly_income}}
        - credit_score: {{credit_score}}
      Застосуй 4-tier policy (див. system prompt). PTI = monthly_payment / monthly_income.
      Поверни JSON.
    # interrupt_before: true   # розкоментуй для HITL gate перед approve
    output_schema: |
      {
        "type": "object",
        "properties": {
          "decision": {"type": "string", "enum": ["approve", "decline", "manual_review"]},
          "rate_apr": {"type": ["number", "null"]},
          "reason":   {"type": "string"}
        },
        "required": ["decision"]
      }
    resolve_dynamic_values_in_prompt: true
    next:
      state_id: end
      store_in_context: true

# ----------------------------------------------------------------------------
# EXECUTION CONFIG
# ----------------------------------------------------------------------------
recursion_limit: 50
max_concurrency: 1           # послідовно (NBU audit)
enable_summarization_node: false
